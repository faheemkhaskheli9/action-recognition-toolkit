name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    # One platform, one Python version is the v1.0 bar (see
    # docs/plans/v1-release-plan.md §A3) -- expand the matrix later only if
    # it earns its keep.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Keys the pip cache on pyproject.toml's dependency list so it
          # invalidates automatically when dependencies change; torch/
          # torchvision wheels are large and this is a network-heavy
          # install otherwise (see CLAUDE.md's Install section).
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (library + webapp + dev extras)
        run: pip install -e ".[webapp,dev]"

      - name: Run test suite
        run: pytest
