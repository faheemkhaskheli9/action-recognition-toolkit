[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "action-recognition"
version = "1.1.0"
description = "Train custom action recognition models on your own labeled video datasets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
webapp = ["django>=5.0"]
dev = ["pytest>=7.4", "pytest-django>=4.8"]

[project.scripts]
ar-train = "action_recognition.training.train:main"
ar-predict = "action_recognition.inference.predict:main"
ar-build-manifest = "action_recognition.scripts.build_manifest:main"
ar-split-dataset = "action_recognition.scripts.split_dataset:main"
ar-extract-tracks = "action_recognition.scripts.extract_tracks:main"
ar-predict-scene = "action_recognition.inference.scene_predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
# webapp/ holds the Django project (config/, core/); pytest-django needs it
# on sys.path *before* it resolves DJANGO_SETTINGS_MODULE, earlier than any
# conftest.py runs — the `pythonpath` ini option is applied early enough.
pythonpath = ["webapp"]
